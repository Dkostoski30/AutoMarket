name: CI

on:
  push:
    branches: [main, "claude/**", "feature/**"]
  pull_request:
    branches: [main]

jobs:
  # ─── Backend ────────────────────────────────────────────────────
  backend-build:
    name: Backend — Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: automarket_test
          POSTGRES_USER: automarket
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        working-directory: automarket-backend
        run: mvn -B verify
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_URL: jdbc:postgresql://localhost:5432/automarket_test
          DB_USERNAME: automarket
          DB_PASSWORD: secret
          REDIS_HOST: localhost
          JWT_SECRET: test-secret-key-must-be-at-least-32-characters-long

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: automarket-backend/target/surefire-reports/

  # ─── Frontend ───────────────────────────────────────────────────
  frontend-build:
    name: Frontend — Build & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: automarket-frontend/package-lock.json

      - name: Install dependencies
        working-directory: automarket-frontend
        run: npm ci

      - name: Lint
        working-directory: automarket-frontend
        run: npm run lint -- --no-fix || true

      - name: Build
        working-directory: automarket-frontend
        run: npm run build:prod

  # ─── Docker Build (on main only) ───────────────────────────────
  docker-build:
    name: Docker — Build Images
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./automarket-backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/automarket-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./automarket-frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/automarket-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
